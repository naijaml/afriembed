# Model registry. `family` selects how task prompts are applied (see afriembed/models/embedder.py).
# `revision` pins the Hugging Face commit every experiment loads (recorded in each results file as model_info.revision).
# `prompts` for non-Gemma families map generic task names to literal prefixes.
models:
  embeddinggemma-2:
    hf_id: google/embeddinggemma-2
    revision: 914f7f89142e33e77833254d9c9b90c3cef7303b  # pinned 2026-10-15
    family: embeddinggemma2
    modalities: [text, image, audio, video]
    params_text_only: 271_000_000
    params_full: 744_000_000
    dim: 768
    matryoshka: [768, 512, 256, 128]
    max_seq_length: 8192
