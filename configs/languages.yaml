  fleurs_core: [amh, gaz, ibo, yor, hau, swh, xho, zul, afr, som, wol, lug, lin, sna]
  fleurs_all: [amh, gaz, ibo, yor, hau, swh, xho, zul, afr, som, wol, lug, lin, sna, nso, nya, umb, fuv, luo, kam, kea]
  ciral: [hau, som, swh, yor]
  fertility: [eng, fra, arb, amh, gaz, ibo, yor, hau, swh, kin, xho, zul, afr, som, wol, lug, lin, sna, nso, nya, umb, fuv, luo, kam, kea, ewe, twi, tir, kik, bem]
